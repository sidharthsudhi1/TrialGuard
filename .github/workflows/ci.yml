name: CI

on:
  push:
    branches: [main, "phase/**"]
  pull_request:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest

    # A scratch Postgres so the WS-1 durability tests actually run instead of
    # skipping. The pgvector build, so the full trials DDL (VECTOR, generated
    # tsvector) can be applied and the refresh's publish path tested against a
    # real database rather than a mock. This is not the deployed environment WS-6
    # defers latency to -- it is an empty database that the suite creates and
    # drops its own tables in.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev,web]" pytest-cov

      - name: Lint
        run: ruff check .

      - name: Secret hygiene
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "ERROR: .env is tracked in git"; exit 1
          fi
          echo ".env not tracked."

      - name: Tests
        env:
          TG_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        # Coverage is a ratchet, not a target: 55 sits just under the 59 measured
        # in E5 so a real drop fails while ordinary churn does not. The number
        # that matters is per-module -- verify/grounding.py is at 100%, the agent
        # graph 97% -- and the total is dragged down by eval harnesses and
        # one-shot scripts that tests are not the right instrument for.
        run: pytest tests/ -q --cov=src/trialguard --cov-report=term --cov-fail-under=55

      # E5 widened this from three hand-picked files to all of src/. Settings
      # (including the two documented third-party overrides) live in pyproject.
      - name: Typecheck
        run: mypy src/trialguard

      # Faithfulness regression gate — runs on committed artifacts only (no Groq,
      # no analyst cache). Fails the build red if the deterministic catch rate
      # drops below 100% or any committed A/B floor regresses.
      - name: Regression gate
        run: python -m trialguard.eval.regression_gate

      # Blocking as of E5. Every project dependency CVE open at that point was
      # fixed rather than accepted (aiohttp and anyio sit in the served request
      # path; torch arrives via sentence-transformers), and pyproject carries
      # version floors so a fresh resolve cannot regress.
      #
      # pip and setuptools are skipped because they are the runner's own
      # toolchain rather than anything this project ships, and a CVE in them
      # would otherwise fail every build for something no commit here can fix.
      - name: Dependency audit
        run: |
          pip install pip-audit
          pip-audit --skip-editable --ignore-vuln PYSEC-2026-196 \
            --ignore-vuln PYSEC-2026-1795 --ignore-vuln PYSEC-2026-1796 \
            --ignore-vuln PYSEC-2026-2875 --ignore-vuln PYSEC-2026-2876 \
            --ignore-vuln PYSEC-2026-3721 --ignore-vuln PYSEC-2026-3447
