name: CI

on:
  push:
    branches: [main, "phase/**"]
  pull_request:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev,web]"

      - name: Lint
        run: ruff check .

      - name: Secret hygiene
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "ERROR: .env is tracked in git"; exit 1
          fi
          echo ".env not tracked."

      - name: Tests
        run: pytest tests/ -q

      - name: Typecheck
        run: mypy src/trialguard/db src/trialguard/agent/schema.py src/trialguard/retrieval/pipeline.py --ignore-missing-imports

      # Faithfulness regression gate — runs on committed artifacts only (no Groq,
      # no analyst cache). Fails the build red if the deterministic catch rate
      # drops below 100% or any committed A/B floor regresses.
      - name: Regression gate
        run: python -m trialguard.eval.regression_gate

      # Advisory: surfaces known CVEs in the dependency tree without failing the
      # build on upstream issues we cannot fix in this PR.
      - name: Dependency audit
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit || true
