# fly.toml — TrialGuard Stage A API
# Create with: fly apps create trialguard-api
# Secrets: DATABASE_URL, DEEPINFRA_API_KEY (or GROQ_API_KEY), DAILY_USD_CAP,
#          API_CORS_ORIGIN (Vercel frontend origin), LLM_PROVIDER

app = "trialguard-api"
primary_region = "syd"

[build]
  dockerfile = "Dockerfile.api"

[http_service]
  internal_port = 8000
  force_https = true
  # suspend, not stop: suspend snapshots RAM, so MedCPT stays resident and resume
  # skips the torch import and model load that make a cold boot cost ~30s+. With
  # min_machines_running = 1 the last machine never stopped at all, so the machine
  # was billed around the clock to serve a demo that is idle most of the day.
  # Verify it engages: `fly machine status` must report suspended, not stopped. If
  # it falls back to stop, the cost is one slow first request, not a broken app.
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "2m"
    method = "GET"
    path = "/api/health"

# performance, not shared: MedCPT loads inside the FastAPI lifespan hook, so the
# machine serves nothing until torch has imported and the encoder is resident.
# On throttled shared vCPUs that took 113s against a 120s health-check grace
# period, so every cold boot was a coin flip between ready and restarted.
[[vm]]
  memory = "4gb"
  cpu_kind = "performance"
  cpus = 2
