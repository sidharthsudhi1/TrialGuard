# fly.toml — TrialGuard Stage A API
# Create with: fly apps create trialguard-api
# Secrets: DATABASE_URL, DEEPINFRA_API_KEY (or GROQ_API_KEY), DAILY_USD_CAP,
#          API_CORS_ORIGIN (Vercel frontend origin), LLM_PROVIDER

app = "trialguard-api"
primary_region = "syd"

[build]
  dockerfile = "Dockerfile.api"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "2m"
    method = "GET"
    path = "/api/health"

[[vm]]
  memory = "2gb"
  cpu_kind = "shared"
  cpus = 2
