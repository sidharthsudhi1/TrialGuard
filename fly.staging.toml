# fly.staging.toml — load-test target for S2. Never the production app.
#
#   fly deploy -c fly.staging.toml
#
# Secrets: DATABASE_URL (a Neon branch, not the production database),
#          API_STAGING_BYPASS_TOKEN, API_CORS_ORIGIN. No LLM key: the load test
#          only sends notes whose keywords are already cached.

app = "trialguard-api-staging"
primary_region = "syd"

[build]
  dockerfile = "Dockerfile.api"

[env]
  TG_CACHE_KEY_CRITERIA = "1"
  DAILY_USD_CAP = "0"

[http_service]
  internal_port = 8000
  force_https = true
  # stop, not suspend: nothing here needs a fast resume, and a stopped machine
  # bills storage only.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  # Per-request balancing with a low soft limit, so the proxy spreads a closed
  # loop across every machine instead of filling the first one.
  [http_service.concurrency]
    type = "requests"
    soft_limit = 2
    hard_limit = 32

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "5m"
    method = "GET"
    path = "/api/health"

# Same machine as production, so a per-machine number carries over.
[[vm]]
  memory = "4gb"
  cpu_kind = "performance"
  cpus = 2
