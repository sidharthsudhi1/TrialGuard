[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trialguard"
version = "0.1.0"
description = "Self-verifying multi-agent clinical-trial eligibility intelligence"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    # Orchestration
    "langgraph>=0.2",
    "langchain>=0.3",
    "langchain-community>=0.3",
    "langchain-groq>=0.2",
    # OpenAI-compatible client: covers DeepInfra, Together, Fireworks, OpenRouter,
    # and vLLM via base_url. Not a dependency on OpenAI the vendor.
    "langchain-openai>=0.2",

    # Embeddings
    "sentence-transformers>=3.0",

    # Retrieval
    "rank-bm25>=0.2",

    # Vector store
    "psycopg2-binary>=2.9",
    "pgvector>=0.3",

    # Config & secrets
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",

    # HTTP
    "httpx>=0.27",

    # Tracing
    "langfuse>=2.0",

    # Data wrangling
    "pandas>=2.2",

    # Stats (faithfulness A/B significance)
    "scipy>=1.11",

    # CLI / display
    "rich>=13.0",

    # Security floors on transitive dependencies (E5). These arrive via
    # langchain, fastapi and sentence-transformers; they are named here so a
    # fresh install cannot resolve back to a version pip-audit flags.
    # aiohttp <3.14.3 and anyio <4.14.2 sit in the served request path.
    "aiohttp>=3.14.3",
    "anyio>=4.14.2",
    "torch>=2.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
]
demo = [
    "gradio>=4.0",
]
web = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
# E5 widened this from three hand-picked targets to all of src/. It is not
# --strict: the goal is to catch real defects (it found a bare `return` on a
# safety-abort path, an annotation that disagreed with its own function body,
# and one `spent` variable holding tokens on one line and dollars on another),
# not to chase annotations through research code.
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true

[[tool.mypy.overrides]]
# langchain's constructors are typed to SecretStr and a narrower kwarg set than
# they accept at runtime; ChatOpenAI takes max_tokens and both take a plain str
# api_key. Silencing the call sites rather than casting keeps the runtime
# behaviour that every committed result was produced under.
module = "trialguard.llm.provider"
disable_error_code = ["arg-type", "call-arg"]

[[tool.mypy.overrides]]
# langfuse v3's handler accepts metadata and carries attributes its stubs omit.
module = "trialguard.tracing"
disable_error_code = ["call-arg", "attr-defined"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F/I were the original set. The rest were added in E5, after measuring what
# they actually catch here: B for real bug shapes (loop-variable closures,
# zip length mismatch), S for security, UP/SIM/RUF/PTH for drift. ASYNC is
# selected although it currently finds nothing, so a future async defect fails
# the build rather than arriving unnoticed.
select = ["E", "F", "I", "B", "ASYNC", "S", "UP", "SIM", "RUF", "PTH"]
ignore = [
    # Prose in docstrings and reports legitimately contains en/em dashes and
    # arrows. Flagging them as ambiguous unicode is noise, not a finding.
    "RUF001", "RUF002", "RUF003",
    # Stylistic, and each would churn working code without closing a defect
    # class: SIM905 collapses a deliberately formatted multi-line word list into
    # a 1098-character literal, SIM117 flattens nested `with` blocks that read
    # better apart, and the PTH rules rewrite `open()` calls that are correct.
    "SIM905", "SIM117", "PTH123", "PTH105",
    # RUF100 reads per-file-ignored rules as "not enabled" and strips the
    # noqa directives that suppress them, so running it removes working
    # suppressions. Stale-noqa hygiene is not worth that trade here.
    "RUF100",
]

[tool.ruff.lint.per-file-ignores]
# Test fixtures carry long inline medical-string/JSON literals; report-building
# scripts emit long markdown table rows. Long lines there are intrinsic, not debt.
# S101 (assert) is what a test is; flagging it would silence the rule everywhere.
# S603/S607 in scripts is deliberate local tooling, not untrusted input.
# RUF012 and S603 in tests are test doubles and a deliberate subprocess call
# that asserts the demo entrypoint still starts; neither is production risk.
"tests/*" = ["E501", "S101", "S105", "S106", "S108", "S311", "RUF012", "S603"]
"scripts/*" = ["E501", "S108", "S311", "S603", "S607"]
"src/trialguard/scripts/*" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
